name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: python -m pip install pytest jsonschema

      - name: Test agent
        working-directory: agent
        run: python -m pytest tests/ -q

      - name: Test progress SDK
        working-directory: progress
        run: python -m pytest tests/ -q

      - name: Build and validate agent zipapp
        run: ./scripts/build-agent-zipapp.sh

  swift:
    name: Swift
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Test SlurmBarKit
        working-directory: app
        run: swift test
