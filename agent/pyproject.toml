[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slurmbar-agent"
version = "0.2.1"
description = "One-shot Slurm data collector for SlurmBar. Runs on a cluster login node over SSH."
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [{ name = "SlurmBar contributors" }]
keywords = ["slurm", "hpc", "monitoring", "menu bar"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.scripts]
slurmbar-agent = "slurmbar_agent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4"]

[tool.setuptools]
packages = ["slurmbar_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
